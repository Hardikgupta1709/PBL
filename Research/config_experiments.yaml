# ============================================================================
# Research Experiment Configuration
# All hyperparameters, data splits, and experiment settings in one place.
# NO experiment parameter should be hardcoded elsewhere — import from here.
# ============================================================================

# --- Temporal Split (strict, no overlap) ---
DATA_START: "2015-01-01"          # Earliest data to download
TRAIN_END: "2020-12-31"           # RF regime classifier trained up to here
VALIDATE_START: "2021-01-01"      # Parameter tuning window
VALIDATE_END: "2022-12-31"
TEST_START: "2023-01-01"          # Final reporting — NEVER used for tuning
TEST_END: "2025-06-30"

# --- Strategy Defaults ---
strategy:
  entry_z_normal: 1.5
  exit_z_normal: 0.5
  entry_z_volatile: 2.0
  exit_z_volatile: 0.3
  min_hold_days: 3
  z_score_window: 40
  max_hold_days: 30
  stop_loss_multiplier: 2.0

# --- Regime Classifier ---
regime:
  n_estimators: 300
  max_depth: 6
  min_samples_split: 40
  min_samples_leaf: 20
  random_state: 42
  vol_crisis: 0.35
  vol_volatile: 0.22
  dd_crisis: -0.20
  dd_volatile: -0.10

# --- Kalman Filter ---
kalman:
  delta: 1.0e-4
  var_e: 1.0e-3
  var_eta: 1.0e-4
  crisis_noise_mult: 5
  volatile_noise_mult: 2
  outlier_mad_threshold: 3
  innovation_history_size: 50

# --- Pair Discovery ---
pair_discovery:
  min_score: 40               # Lower to get 50+ pairs
  max_pairs_per_sector: 10    # More pairs per sector
  min_data_days: 504          # 2 years minimum
  start_date: "2015-01-01"
  end_date: "2025-06-30"

# --- Monte Carlo ---
monte_carlo:
  n_simulations: 10000
  confidence_level: 0.95
  random_seed: 42

# --- Walk-Forward ---
walk_forward:
  step_days: 63               # Quarterly steps
  min_train_days: 504          # 2 years minimum training
  test_days: 126              # 6 months test
  min_folds: 8

# --- Bootstrap ---
bootstrap:
  n_resamples: 10000
  confidence_level: 0.95
  random_seed: 42

# --- Transaction Costs ---
transaction_costs:
  slippage_bps: 5
  commission_per_trade: 1.0

# --- Sensitivity Grid ---
sensitivity:
  entry_z_values: [1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
  exit_z_values: [0.2, 0.3, 0.5, 0.7, 1.0]
  z_windows: [30, 40, 60]

# --- Market Benchmark ---
benchmark_ticker: "SPY"

# --- Global Reproducibility ---
reproducibility:
  python_version: "3.12.9"
  random_seed: 42
  numpy_seed: 42
  results_dir: "Research/results"
  figures_dir: "Paper/figures"
  tables_dir: "Paper/tables"

# --- Feature Analysis ---
feature_analysis:
  shap_samples: 500
  permutation_repeats: 10
  top_k_features: 10

# --- Cointegration Analysis ---
cointegration:
  rolling_window: 252
  significance_level: 0.05

# --- Baselines ---
baselines:
  methods:
    - "Full System (Ours)"
    - "Gatev Distance"
    - "OLS Cointegration"
    - "Kalman-Only (No Regime)"
    - "Regime-Only (No Kalman)"
    - "B&H Stocks (50/50)"
    - "SPY Buy-and-Hold"

# --- Regime Comparison ---
regime_comparison:
  methods:
    - name: "Random Forest"
    - name: "Hidden Markov Model"
    - name: "Simple Volatility Rules"

# --- Figure Generation ---
figures:
  dpi: 300
  format: ["pdf", "png"]
  style: "seaborn-v0_8-whitegrid"
  count: 11

# --- Table Generation ---
tables:
  count: 8

# --- Paper Trading ---
paper_trading:
  platform: "Alpaca"
  mode: "paper"
  initial_capital: 100000
  start_date: "2026-01-29"
  end_date: "2026-03-06"

# --- Test Pairs ---
pairs:
  - ticker_y: "BAC"
    ticker_x: "PNC"
    sector: "Banking"
  - ticker_y: "WFC"
    ticker_x: "MS"
    sector: "Financial Services"
  - ticker_y: "CVX"
    ticker_x: "OXY"
    sector: "Energy"

# --- Dynamic Pair Selection (Week 8) ---
dynamic_filter:
  adf_pvalue: 0.05
  hurst_max: 0.50
  coint_pvalue: 0.05
  half_life_max: 60
  half_life_min: 3
  lookback_window: 126
  min_checks_passed: 2
  grace_period: 5
  health_step: 5

# --- Expanded Universe (Week 9) ---
expanded_universe:
  min_score: 40
  max_pairs_per_sector: 5
  target_pairs: 25
  run_dynamic_filter: true
  run_monte_carlo: true
  run_bootstrap: true

# --- RL Agent (Week 10) ---
rl_agent:
  hidden_size: 64
  learning_rate: 0.0005
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  batch_size: 64
  buffer_size: 50000
  target_update_freq: 10
  max_episodes: 150
  early_stop_patience: 20
  dropout: 0.1
  weight_decay: 0.0001
  val_end_date: "2022-12-31"
